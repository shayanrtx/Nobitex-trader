[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nobitex-trader"
version = "0.1.0"
description = "Adaptive grid / swing trading bot for the Nobitex exchange (USDT-IRT focused)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=12",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
socks = ["httpx[socks]>=0.27,<1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
nobitex-trader = "nobitex_trader.cli:main"

[tool.setuptools.packages.find]
include = ["nobitex_trader*"]

[tool.setuptools.package-data]
nobitex_trader = ["dashboard/*.html", "dashboard/static/fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
